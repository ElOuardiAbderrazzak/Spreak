<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffbf6" />
    <meta name="description" content="Type Dutch, hear it in a natural voice, and see where the stress falls." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spreak" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Spreak · Dutch pronunciation</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <picture>
            <source srcset="./lion-head.webp" type="image/webp" />
            <img class="mark" src="./lion-head.png" alt="" width="32" height="32" />
          </picture>
          <h1>Spreak</h1>
        </div>
        <div class="topbar-actions">
          <button class="pill accent" id="accent-btn" type="button" title="Standard Dutch, formal register">
            <span class="dot"></span><span class="accent-label">NL · formeel</span>
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="centre">
          <div class="hero" id="hero">
            <picture>
              <source srcset="./lion-body.webp" type="image/webp" />
              <img class="hero-mascot" src="./lion-body.png" alt="Spreak's robot lion mascot" width="184" height="230" />
            </picture>
            <h2>Type Dutch.<br />Hear it right.</h2>
            <p class="sub">Stress marks, IPA and the sounds spelled out the way you already read them.</p>
            <div class="suggestions" id="suggestions"></div>
          </div>

          <div class="composer">
            <label class="sr" for="text">Dutch text</label>
            <textarea id="text" rows="2" lang="nl" spellcheck="false" autocapitalize="sentences"
              placeholder="Type or paste Dutch…"></textarea>
            <div class="composer-actions">
              <button class="pill ghost" id="settings-btn" type="button" aria-haspopup="dialog">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 21v-6M5 11V3M12 21v-9M12 8V3M19 21v-4M19 13V3M2 15h6M9 8h6M16 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span id="modes-label">IPA · EN</span>
              </button>
              <span class="kbd">⏎ to speak</span>
              <span class="spacer"></span>
              <button class="icon-btn" id="mic" type="button" aria-label="Dictate">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.9"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5V21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
              </button>
              <button class="send" id="send" type="button" aria-label="Analyse">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19.5V5M5.5 11.5 12 5l6.5 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>

          <div class="status" id="status" role="status" aria-live="polite"></div>

          <div class="results" id="results" hidden>
            <div class="results-head">
              <button class="pill" id="speak" type="button">
                <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.8 3.1a.6.6 0 0 1 .92-.5l7 4.9a.6.6 0 0 1 0 1l-7 4.9a.6.6 0 0 1-.92-.5V3.1Z" fill="currentColor"/></svg>
                Speak
              </button>
              <button class="pill ghost" id="slow" type="button" title="Speak slowly">
                <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.8 3.1a.6.6 0 0 1 .92-.5l7 4.9a.6.6 0 0 1 0 1l-7 4.9a.6.6 0 0 1-.92-.5V3.1Z" fill="currentColor"/></svg>
                0.6×
              </button>
              <button class="icon-btn framed" id="stop" type="button" aria-label="Stop">
                <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="2" fill="currentColor"/></svg>
              </button>
              <p class="eyebrow" id="results-hint">Tap a word to hear it alone</p>
            </div>
            <div class="words" id="words"></div>
            <div class="legend">
              <span><i style="background: var(--o-500)"></i>main stress</span>
              <span><i style="background: var(--o-200)"></i>secondary</span>
              <span><i style="background: var(--border-strong)"></i>weak word</span>
            </div>
          </div>

          <div class="recent" id="recent" hidden>
            <p class="eyebrow">Recent</p>
            <div class="recent-list" id="recent-list"></div>
          </div>
        </section>

        <aside class="detail-col" id="detail-col"></aside>
      </main>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Modes and languages" aria-hidden="true">
      <div class="grabber"></div>
      <div class="sheet-head">
        <h3>Modes &amp; languages</h3>
        <button class="pill" id="sheet-done" type="button">Done</button>
      </div>
      <div id="sheet-body"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
